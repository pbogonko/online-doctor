services:
  backend:
    build:
      context: ./backend
      dockerfile: dockerfile
    image: backend:v1.0
    # ports:
    #   - "3000:3000"
    env_file:
      - ./backend/.env.example
    networks:
      - app_network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile
    image: frontend:v1.0
    ports:
      - "192.168.0.110:80:80"
      - "192.168.0.110:443:443"
    volumes:
      - ./:/etc/ssl/certs/nginx-selfsigned.crt:ro
      - ./:/etc/ssl/private/nginx-selfsigned.key:ro
    networks:
      - app_network
    depends_on:
      - backend
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  app_network:
    driver: bridge
