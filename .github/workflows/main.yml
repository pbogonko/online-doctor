# environment variables
# - workflow variables, job variables and steps variables
# - persisting environment variables
name: variables and artifacts
on:
    workflow_dispatch:

# 1. Workflow-level variables (Accessible by ALL jobs and ALL steps)
env:
    TOKENS: 28474dfhvpd97

jobs:
    testing_workflow_variables:
        runs-on: ubuntu-latest
        outputs:
            MY_TOKENS: ${{ steps.tokens.outputs.mytoken }}
        steps:
            - name: "workflow variables"
              id: tokens 
              run: | 
                mytoken=5994049rjrfhfhr  
                echo "mytoken=${mytoken}" >> "$GITHUB_OUTPUT"

    # JOBS VARIABLES
    testing_jobs_variables:
        needs: testing_workflow_variables
        # 2. Job-level variables (Accessible only within this specific job)
        env:
            JOB_VAR: 4730jfhdpsldhgdf
        runs-on: ubuntu-latest
        steps:
            - name: "job variables used within a job"
              run: echo "JOB VARIABLE:$JOB_VAR"

            - name: "workflow variable"
              run: echo "still we can access workflow variables"

            # FIX: Changed $tTOKENS to $TOKENS (typo correction)
            - name: "workflow variables"  
              run: echo "WORKFLOW_VAR:$TOKENS"

    # STEPS VARIABLES
    testing_steps:
        needs: 
            - testing_workflow_variables
            - testing_jobs_variables
        env:
          JOB3_VAR: 45677494033827dhfheie
        runs-on: ubuntu-latest
        steps:
            - name: "steps variables"
              # 3. Step-level variables (Accessible ONLY within this single step block)
              env:
                STEP_VARS: "STEP VARIABLES"
              run: |
                # FIX: Changed $WORKFLOW_ENV to $TOKENS to match your global env block
                echo "workflow_vars:$TOKENS"
                # FIX: Changed $JOB_VARS to $JOB3_VAR to match this job's env block
                echo "jobs_var:$JOB3_VAR"
                echo "steps_var:$STEP_VARS"

            # NOTE: This will print empty because STEP_VARS belonged to the previous step
            - name: "steps variables"
              run: echo "steps var:$STEP_VARS"

            - name: "step one"
              env:
                STEPS_VAR: 3833494ehddbdn
              run: echo "used only here:$STEPS_VAR"

            # NOTE: This will print empty because STEPS_VAR was scoped to 'step one'
            - name: "step variable"
              run: echo "STEPS VAR:$STEPS_VAR"
             
            - name: "steps var print"
              run: echo "Workflow variables:$TOKENS"

            - name: "job variables"
              run: echo "JOB3_VAR:$JOB3_VAR"

            # NOTE: This will print empty (correctly noted as unreachable by you)
            - name: "steps variables(unreachable)"
              run: echo "STEPS VARIABLES:$STEP_VARS"

            - name: "persisted value"
              # FIX: The output MY_TOKENS originates from 'testing_workflow_variables', NOT 'testing_jobs_variables'
              run: echo "perst var:${{ needs.testing_workflow_variables.outputs.MY_TOKENS }}"
    
    # persisting variables
    git_environment:
        needs: testing_workflow_variables # FIX: Must declare needs to access its outputs
        runs-on: ubuntu-latest
        steps:
            - name: "environment variables"
              # FIX: Correct context access to read the cross-job persisted token
              run: echo "ENVIRONMENT VAR token value is:${{ needs.testing_workflow_variables.outputs.MY_TOKENS }}"










