name: secrets-scan

on:
    workflow_dispatch:
    push:
        branches:
            - main

env:
    GITLEAKS_SECRETS: ${{ secrets.GITLEAKS_SECRETS }}
    AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
    AWS_ECR_REPOSITORY: ${{ secrets.AWS_ECR_REPOSITORY }}
    AWS_REGION: ${{ secrets.AWS_REGION }}
    AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}

jobs:
    trivy-scan:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

            - name: Run Trivy scan
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                scan-type: fs
                severity: CRITICAL,HIGH,MEDIUM
                format: table
                output: trivy-report.txt

            - name: Upload Trivy report as artifact
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
              with:
                name: trivy-report
                path: trivy-report.txt
    
    git-secrets-scan:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

            - name: gitleaks scan
              uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
              with:
                args: "--verbose --redact --report-format json --report-path gitleaks-report.json"

            - name: Upload gitleaks report as artifact
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
              with:
                name: gitleaks-report
                path: gitleaks-report.json
    
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

            - name: Build Docker image
              run: docker build -t my-app .

            - name: Upload Docker image as artifact
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
              with:
                name: docker-image
    test-image:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v2
              with:
                role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
                aws-region: ${{ secrets.AWS_REGION }}

            - name: Login to Amazon ECR
              run: |
                aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.AWS_ECR_REPOSITORY }}

            - name: Build and push Docker image to ECR
              run: |
                docker build -t my-app .
                docker tag my-app:latest ${{ secrets.AWS_ECR_REPOSITORY }}:latest
                docker push ${{ secrets.AWS_ECR_REPOSITORY }}:latest

