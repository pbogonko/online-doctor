
name: Repo Activity Notifications

on:
  create:
  fork:
  push:
    branches:
      - main                  # <-- change to the branch you want to watch
  pull_request:
    types: [opened]
  pull_request_target:
    types: [closed]

jobs:

  branch-created:
    if: github.event_name == 'create' && github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - name: Email - branch created
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "🌱 New branch created in ${{ github.repository }}"
          to: ${{secrets.EMAIL_USERNAME}}
          from: GitHub Actions
          body: "Branch '${{ github.event.ref }}' was created by ${{ github.actor }} in ${{ github.repository }}."

  repo-forked:
    if: github.event_name == 'fork'
    runs-on: ubuntu-latest
    steps:
      - name: Email - fork created
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "🍴 ${{ github.repository }} was forked"
          to:  ${{ secrets.EMAIL_USERNAME }}
          from: GitHub Actions
          body: "${{ github.repository }} was forked by ${{ github.actor }}."

  branch-pushed:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Email - push to watched branch
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "📌 Push to ${{ github.ref_name }} in ${{ github.repository }}"
          to:  ${{ secrets.EMAIL_USERNAME }}
          from: GitHub Actions
          body: "${{ github.actor }} pushed to '${{ github.ref_name }}': ${{ github.event.head_commit.message }}"

  pr-opened:
    if: github.event_name == 'pull_request' && github.event.action == 'opened'
    runs-on: ubuntu-latest
    steps:
      - name: Email - PR opened
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "🔀 New PR #${{ github.event.pull_request.number }} in ${{ github.repository }}"
          to:  ${{ secrets.EMAIL_USERNAME}}
          from: GitHub Actions
          body: "PR #${{ github.event.pull_request.number }} '${{ github.event.pull_request.title }}' opened by ${{ github.actor }}."

  pr-merged:
    if: github.event_name == 'pull_request_target' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Email - PR merged
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "✅ PR #${{ github.event.pull_request.number }} merged in ${{ github.repository }}"
          to:  ${{ secrets.EMAIL_USERNAME }}
          from: GitHub Actions
          body: "PR #${{ github.event.pull_request.number }} '${{ github.event.pull_request.title }}' merged by ${{ github.actor }}."
