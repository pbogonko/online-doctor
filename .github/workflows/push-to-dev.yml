name: push-to-dev
on:
  push:
    branches:
      - main
jobs:
  push-to-dev:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Validate DockerHub credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "::error::DOCKERHUB_USERNAME secret is missing. Add it in the repository's Actions secrets."
            exit 1
          fi
          if [ -z "$DOCKER_PASSWORD" ]; then
            echo "::error::DOCKER_PASSWORD secret is missing. Add it in the repository's Actions secrets."
            exit 1
          fi

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/backend:dev

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/frontend:dev

      - name: Deploy to development server
  
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_PATH: ${{ secrets.SERVER_PATH }}
        run: |
          set -euo pipefail

          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error::SSH_KEY secret is missing."
            exit 1
          fi
          if [ -z "$SERVER_HOST" ]; then
            echo "::error::SERVER_HOST secret is missing."
            exit 1
          fi
          if [ -z "$SERVER_PATH" ]; then
            echo "::error::SERVER_PATH secret is missing."
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          SERVER_ADDRESS="${SERVER_HOST#*@}"
          SERVER_PORT="${SERVER_PORT:-22}"
          echo "Scanning SSH host key..."
          if ! ssh-keyscan -v -T 10 -p "$SERVER_PORT" -H "$SERVER_ADDRESS" >> ~/.ssh/known_hosts; then
            echo "::error::Could not scan SERVER_HOST on port $SERVER_PORT. Check that SERVER_HOST is [user@]hostname-or-IP, SERVER_PORT is correct, and the host is reachable from GitHub Actions."
            exit 1
          fi
          chmod 644 ~/.ssh/known_hosts

          printf -v QUOTED_SERVER_PATH '%q' "$SERVER_PATH"
          echo "Starting remote deployment..."
          if ! ssh -o BatchMode=yes -o ConnectTimeout=20 -p "$SERVER_PORT" -i ~/.ssh/id_rsa "$SERVER_HOST" "bash -s -- $QUOTED_SERVER_PATH" << 'EOF'
            set -euo pipefail
            echo "Connected; checking deployment directory."
            cd -- "$1"
            echo "Pulling images."
            docker-compose pull
            echo "Starting services."
            docker-compose up -d --force-recreate
            docker ps
          EOF
          then
            echo "::error::SSH or remote deployment failed. Inspect the SSH/Compose output above."
            exit 1
          fi

        
  
